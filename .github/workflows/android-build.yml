name: Android build and tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare stable test signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DAILY_CLASSICS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add DAILY_CLASSICS_KEYSTORE_BASE64 and DAILY_CLASSICS_KEYSTORE_PASSWORD repository secrets before building an installable update."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dailyclassics-test.keystore"
          echo "DAILY_CLASSICS_KEYSTORE_PATH=$RUNNER_TEMP/dailyclassics-test.keystore" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Run Android lint
        run: gradle :app:lintDebug
      - name: Assemble debug APK
        env:
          DAILY_CLASSICS_KEYSTORE_PASSWORD: ${{ secrets.DAILY_CLASSICS_KEYSTORE_PASSWORD }}
          DAILY_CLASSICS_KEY_ALIAS: dailyclassics
        run: gradle :app:assembleDebug
      - name: Assemble unsigned release APK
        run: gradle :app:assembleRelease
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Classics-verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Classics-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Classics-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
